<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Austin Fallen Heroes — Interactive 3D Memorial</title>
  <meta name="description" content="An interactive 3D memorial honoring fallen service members from the Austin and Central Texas area." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles/main.css" />
</head>
<body>
  <canvas id="memorial-canvas"></canvas>

  <!-- Opening overlay -->
  <div id="intro-overlay">
    <div class="intro-content">
      <h1>Austin Fallen Heroes</h1>
      <p>An interactive memorial honoring service members from<br/>the Austin &amp; Central Texas area who gave the ultimate sacrifice.</p>
      <button id="enter-btn">Enter Memorial</button>
    </div>
  </div>

  <!-- Detail panel V2 -->
  <div id="detail-panel" class="hidden">
    <button id="close-panel">&times;</button>
    <div class="portrait-wrapper">
      <img id="hero-portrait" src="" alt="" />
    </div>
    <h2 id="hero-name"></h2>
    <div id="hero-rank-branch" class="detail-meta"></div>
    <div id="hero-unit" class="detail-unit"></div>
    <div id="hero-stats" class="detail-stats"></div>
    <p id="hero-bio" class="detail-bio"></p>
    <div id="hero-awards" class="detail-awards"></div>
    <div id="hero-memorial-note" class="detail-memorial-note"></div>
    <a id="hero-news-link" class="news-link" href="#" target="_blank" rel="noopener">
      Read More &rarr;
    </a>
    <div class="detail-honor">
      <em>"All gave some. They gave all."</em>
    </div>
  </div>

  <!-- Conflict legend -->
  <div id="legend">
    <span class="legend-item"><span class="dot oif"></span> OIF</span>
    <span class="legend-item"><span class="dot oef"></span> OEF</span>
    <span class="legend-item"><span class="dot ofs"></span> OFS</span>
  </div>

  <!-- Instruction hint -->
  <div id="hint">Click a name to learn their story</div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
